name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.platform || 'native' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          #- os: ubuntu-latest
          #  platform: linux
          #- os: windows-latest
          #  platform: windows
          #- os: macos-26
          #  platform: macos
          - os: ubuntu-latest
            platform: android
          #- os: macos-14
          #  platform: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up QEMU (for Linux ARM/i686)
        if: runner.os == 'Linux' && matrix.platform == 'linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Android SDK (for Android build)
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update && sudo apt-get install -y wget unzip
          
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d /usr/local/lib/android/sdk
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools/latest
          mv /usr/local/lib/android/sdk/cmdline-tools/bin/* /usr/local/lib/android/sdk/cmdline-tools/latest/ 2>/dev/null || true
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses
          
          sdkmanager "platform-tools" "platforms;android-34" "ndk;26.1.10909125"
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Verify Android SDK
        if: matrix.platform == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME" || echo "SDK directory not found"
          ls "$ANDROID_NDK_HOME" || echo "NDK directory not found"

      - name: Build Android wheels
        if: matrix.platform == 'android'
        run: |
          mkdir -p wheelhouse
          
          pip install setuptools wheel Cython numpy
          
          ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64" "x86")
          
          for ARCH in "${ARCHS[@]}"; do
            echo "Building for $ARCH..."
            
            export ANDROID_ABI=$ARCH
            
            # Для arm64-v8a
            if [ "$ARCH" == "arm64-v8a" ]; then
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
              export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++
              export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
              export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
            elif [ "$ARCH" == "armeabi-v7a" ]; then
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang
              export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang++
              export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
              export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
            elif [ "$ARCH" == "x86_64" ]; then
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang
              export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android29-clang++
              export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
              export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
            elif [ "$ARCH" == "x86" ]; then
              export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android29-clang
              export CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android29-clang++
              export AR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
              export RANLIB=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
            fi
            
            python setup.py bdist_wheel --plat-name android_${ARCH}
            
            cp dist/*.whl wheelhouse/ 2>/dev/null || true
            rm -rf dist build *.egg-info
          done
          
          echo "Build complete. Wheels:"
          ls -la wheelhouse/

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.platform }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: warn
