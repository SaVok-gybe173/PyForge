name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} for ${{ matrix.platform || 'native' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          #- os: ubuntu-latest
          #  platform: linux
          #- os: windows-latest
          #  platform: windows
          #- os: macos-26
          #  platform: macos
          - os: ubuntu-latest
            platform: android
          #- os: macos-26
          #  platform: ios

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up QEMU (for Linux ARM/i686)
        if: runner.os == 'Linux' && matrix.platform == 'linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Set up Android SDK (for Android build)
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        if: matrix.platform == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          which java curl

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ENVIRONMENT_LINUX: "PYTHONSAFEPATH=1"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS_LINUX: "auto aarch64 i686"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_ANDROID: "arm64_v8a x86_64"
          CIBW_BUILD: ${{ matrix.platform == 'android' && 'cp313-* cp314-*' || '' }}
          # Убираем ручную установку numpy — он уже в build-system.requires,
          # а cibuildwheel сам подменит его заголовки на Android-версию (xbuild-files)
          CIBW_BEFORE_BUILD: "pip install setuptools wheel Cython"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.platform }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: warn
