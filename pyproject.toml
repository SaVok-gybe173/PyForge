[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0", "numpy>=2.1,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "PyForge"
version = "0.1.0"
description = "A powerful 2D game engine for Python"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "requests>=2.34.2",
    "pysdl2",
    "pysdl2-dll",
]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*", "pp*", "graalpy*"]
build-frontend = "uv"          # ← добавлено
# before-build = "uv pip install setuptools wheel"

[tool.cibuildwheel.linux]
archs = ["auto", "i686", "aarch64"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "x86"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64", "universal2"]

[tool.setuptools]
include-package-data = false